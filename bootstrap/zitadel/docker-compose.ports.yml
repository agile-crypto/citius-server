# docker-compose.ports.yml — Citius port-remapping overlay.
#
# Applied last by bootstrap.sh so it wins over the upstream local-tls
# overlay's hard-coded `ports: !override` block.
#
# Set ZITADEL_HTTP_PORT / ZITADEL_HTTPS_PORT in .env to non-privileged
# ports (e.g. 8880 / 8443) when 80 / 443 are already in use on the host.
# Defaults match the upstream overlay (80 / 443) so this file is a no-op
# unless the operator changes them.
services:
  proxy:
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=zitadel
      - --providers.file.filename=/etc/traefik/dynamic/local-tls.yml
      - --entrypoints.web.address=:${ZITADEL_HTTP_PORT:-80}
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:${ZITADEL_HTTPS_PORT:-443}
      - --entrypoints.websecure.http.tls=true
      - --api.dashboard=${TRAEFIK_DASHBOARD_ENABLED}
      - --api.insecure=false
      - --ping=true
      - --ping.entrypoint=web
      - --log.level=${TRAEFIK_LOG_LEVEL}
      - --accesslog=${TRAEFIK_ACCESSLOG_ENABLED}
    ports: !override
      - "${ZITADEL_HTTP_PORT:-80}:${ZITADEL_HTTP_PORT:-80}"
      - "${ZITADEL_HTTPS_PORT:-443}:${ZITADEL_HTTPS_PORT:-443}"

  zitadel-api:
    environment:
      ZITADEL_EXTERNALPORT: ${ZITADEL_HTTPS_PORT:-443}
      ZITADEL_EXTERNALSECURE: true
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://${ZITADEL_DOMAIN}:${ZITADEL_HTTPS_PORT:-443}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://${ZITADEL_DOMAIN}:${ZITADEL_HTTPS_PORT:-443}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://${ZITADEL_DOMAIN}:${ZITADEL_HTTPS_PORT:-443}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: https://${ZITADEL_DOMAIN}:${ZITADEL_HTTPS_PORT:-443}/ui/v2/login/login?samlRequest=

  zitadel-login:
    environment:
      CUSTOM_REQUEST_HEADERS: Host:${ZITADEL_DOMAIN},X-Forwarded-Proto:https
