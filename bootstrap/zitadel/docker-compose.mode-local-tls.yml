# bootstrap/zitadel/docker-compose.mode-local-tls.yml
#
# DEV-ONLY overlay: mounts a mkcert-issued certificate into Traefik so that
# https://${ZITADEL_DOMAIN} is trusted by the host browser (and by the
# Citius server when ZITADEL_INSECURE=false).
#
# Generate the cert with:
#   ./bootstrap.sh certs   # invokes mkcert

services:
  traefik:
    volumes:
      - ./certs:/etc/traefik/certs:ro
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    # Dynamic-config file telling Traefik which cert to serve for our
    # domain is generated by bootstrap.sh into ./certs/dynamic.yml.
