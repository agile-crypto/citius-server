# Citius access-control list, applied by bootstrap/zitadel/setup-auth.
#
# This file is the source of truth for which Zitadel machine and human users
# exist, what gRPC permissions they hold, and which key/policy name patterns
# they may touch. Apply with:
#
#   cd bootstrap/zitadel/setup-auth
#   go run . apply -acl ../acl.yaml
#
# Or validate without any network calls:
#
#   go run . validate -acl ../acl.yaml
#
# The RPC -> permission mapping itself (which RPC requires which permission)
# lives in setup-auth/operations.go because it is tied to the proto compile-
# time invariant and is verified against the generated *_grpc.pb.go method
# constants by an integration test. Do not duplicate it here.
#
# Permission key reference (use "*" below to grant all of them):
#   citius:keys:create        - CreateKey, DeleteKey, ImportKey
#   citius:keys:rotate        - RotateKey, TransformKey, MigrateKey
#   citius:keys:update-policy - UpdateKeyPolicy
#   citius:keys:read          - ReadKey, ListKeys, ValidateKeyOperation, ExportKey
#   citius:crypto:encrypt     - Encrypt*, EncryptMessage*
#   citius:crypto:decrypt     - Decrypt*, DecryptMessage*
#   citius:crypto:sign        - Sign*, DigestSign, SignMessage*
#   citius:crypto:verify      - Verify*, DigestVerify, VerifyMessage*s
#   citius:crypto:misc        - Digest*, Xof*, MAC, KDF, Wrap, KEM, Random
#   citius:policy:read        - ReadCryptoPolicy, ListCryptoPolicies, EvaluatePolicy
#   citius:policy:write       - CreateCryptoPolicy, UpdateCryptoPolicy, DeleteCryptoPolicy
#   citius:discovery:read     - ListTemplates, GetTemplate, ListScopes
#   citius:provider:read      - List/Get providers and instances
#   citius:provider:write     - Register/Update/Delete provider instance
#
# key_access / policy_access patterns are glob-style (* matches any segment).
# An empty `allow:` list means the user has NO key/policy access at all
# (denies don't grant). Omit the section entirely to skip emitting any
# resource-scoping claim for that user (server treats it as unscoped).

version: 1

web_application:
  name: citius-ui
  redirect_uris:
    - http://127.0.0.1:7861/auth/callback
  post_logout_redirect_uris:
    - http://127.0.0.1:7861/
  enable_refresh_tokens: true
  dev_mode: true

users:
  # Catch-all admin: full grant + access to every key and policy.
  - username: svc-admin
    user_type: machine
    display_name: "Citius admin (full grant)"
    permissions: ["*"]
    key_access:
      allow: ["*"]
    policy_access:
      allow: ["*"]

  # Integration-test rig: scoped to itest-* keys and policies.
  - username: svc-tester
    user_type: machine
    display_name: "Citius integration tester"
    permissions:
      - citius:keys:create
      - citius:keys:rotate
      - citius:keys:update-policy
      - citius:keys:read
      - citius:crypto:encrypt
      - citius:crypto:decrypt
      - citius:crypto:sign
      - citius:crypto:verify
      - citius:policy:read
    key_access:
      allow: ["itest-*"]
    policy_access:
      allow: ["itest-*"]

  # Observers: read-only across every read permission.
  - username: svc-readonly
    user_type: machine
    display_name: "Citius read-only consumer"
    permissions:
      - citius:keys:read
      - citius:policy:read
      - citius:discovery:read
      - citius:provider:read

  # Negative-path control: authenticated but holds no permissions.
  # Integration suite asserts requests from this user are rejected with
  # PermissionDenied (not Unauthenticated).
  - username: svc-noperm
    user_type: machine
    display_name: "Citius negative-path user (no permissions)"

  # Interactive policy and key-lifecycle administrator for the UI demo.
  - username: citius-ciso
    user_type: human
    display_name: "Citius CISO"
    given_name: Citius
    family_name: CISO
    email: citius-ciso@citius.local
    email_verified: true
    password_env: CITIUS_DEMO_CISO_PASSWORD
    password_change_required: false
    permissions:
      - citius:policy:read
      - citius:policy:write
      - citius:keys:create
      - citius:keys:read
      - citius:keys:rotate
      - citius:keys:update-policy
      - citius:discovery:read
      - citius:provider:read
    key_access:
      allow: ["demo-*"]
    policy_access:
      allow: ["demo-*"]

  # Creates demo keys and produces ciphertexts and signatures.
  - username: citius-producer
    user_type: human
    display_name: "Citius Producer"
    given_name: Citius
    family_name: Producer
    email: citius-producer@citius.local
    email_verified: true
    password_env: CITIUS_DEMO_PRODUCER_PASSWORD
    password_change_required: false
    permissions:
      - citius:policy:read
      - citius:keys:create
      - citius:keys:read
      - citius:discovery:read
      - citius:provider:read
      - citius:crypto:sign
      - citius:crypto:encrypt
    key_access:
      allow: ["demo-*"]
      deny: ["demo-restricted-*"]
    policy_access:
      allow: ["demo-*"]
      deny: ["demo-restricted-*"]

  # Consumes historical ciphertexts and signatures after key evolution.
  - username: citius-consumer
    user_type: human
    display_name: "Citius Consumer"
    given_name: Citius
    family_name: Consumer
    email: citius-consumer@citius.local
    email_verified: true
    password_env: CITIUS_DEMO_CONSUMER_PASSWORD
    password_change_required: false
    permissions:
      - citius:policy:read
      - citius:keys:read
      - citius:discovery:read
      - citius:crypto:verify
      - citius:crypto:decrypt
    key_access:
      allow: ["demo-*"]
      deny: ["demo-restricted-*"]
    policy_access:
      allow: ["demo-*"]
      deny: ["demo-restricted-*"]
