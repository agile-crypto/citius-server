syntax = "proto3";

package caas.crypto.v1;
option go_package = "github.com/agile-crypto/citius-server/gen/go/api;api";

// ============================================================================
// Abstract Cryptographic API Specification
// Version: 0.1.0
//
// A transport-agnostic, cryptography-provider-agnostic, policy-driven, 
// abstract cryptographic API specification with:
// - Extensibility for future algorithms and algorithm-specific serialization metadata
// - Fine-grained access control via policy enforcement
// - Support for hybrid/composite cryptographic algorithms
// ============================================================================

// ============================================================================
// Type Definitions
// ============================================================================
import "api/types/common.proto";
import "api/types/templates.proto";
import "api/types/providers.proto";

// ============================================================================
// Message Definitions
// ============================================================================
import "api/messages/metadata.proto";
import "api/messages/key_management.proto";
import "api/messages/encryption.proto";
import "api/messages/signing.proto";
import "api/messages/digest.proto";
import "api/messages/key_derivation.proto";
import "api/messages/key_encapsulation.proto";
import "api/messages/key_wrapping.proto";
import "api/messages/mac.proto";
import "api/messages/random.proto";
import "api/messages/policy.proto";

// ============================================================================
// Service Definitions
// ============================================================================
import "api/services/crypto_service.proto";
import "api/services/streaming_crypto_service.proto";
import "api/services/key_management_service.proto";
import "api/services/key_establishment_service.proto";
import "api/services/crypto_policy_service.proto";
import "api/services/provider_service.proto";
import "api/services/discovery_service.proto";
