version: "2"
run:
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - cyclop
    - depguard
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - gocognit
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - revive
    - staticcheck
    - unused
  settings:
    cyclop:
      max-complexity: 15
    depguard:
      rules:
        # core-is-leaf, errors-is-leaf, and the five sibling-bounded-context
        # rules (policy/key/provider/template/crypto-no-siblings) used to pin
        # core/<domain> here. That directory no longer exists in this repo --
        # citius-core is a genuinely separate, published module now (§7 of
        # docs/design-2026/MODULE_TOPOLOGY_EXECUTION_PLAN.md). Linting it is
        # that repo's own responsibility; keeping these rules here would just
        # be dead configuration matching zero files.
        # ── Test-dependency fence ─────────────────────────────────
        no-test-deps-in-prod:
          list-mode: lax
          files:
            - '!$test'
          deny:
            - pkg: github.com/stretchr/testify
              desc: testify is test-only
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: use structured logging instead of fmt.Print
        - pattern: '^fmt\.Errorf$'
          msg: use errors.New or errors.Wrap from citius-core/errors
        - pattern: '^os\.Exit$'
          msg: return errors; os.Exit belongs in main() only
        - pattern: '^log\.(Fatal|Panic).*$'
          msg: use error returns; no log.Fatal in library code
    gocognit:
      min-complexity: 20
    govet:
      disable:
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: receiver-naming
        - name: deep-exit
        - name: dot-imports
        - name: import-alias-naming
          arguments:
            - '^[a-z][a-z0-9]*$'
        - name: filename-format
          arguments:
            - '^[_a-z][_a-z0-9]*\.go$'
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - forbidigo
        path: 'internal/cmd/server/main/'
      - linters:
          - forbidigo
        path: 'bootstrap/zitadel/interactive-login/'
      - linters:
          - cyclop
          - errcheck
          - forbidigo
          - gosec
        path: _test\.go
    paths:
      - gen
      - vendor
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - gen
      - vendor
      - third_party$
      - builtin$
      - examples$
