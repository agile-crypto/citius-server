# golangci-lint configuration for CaaS Server

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    # Core correctness
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - typecheck
    - unused

    # Formatting
    - gofmt
    - goimports

    # Style & naming
    - revive
    - misspell

    # Security
    - gosec

    # Proto enum completeness
    - exhaustive

    # Error handling
    - nilerr
    - errorlint

    # Complexity
    - cyclop
    - gocognit

linters-settings:
  exhaustive:
    default-signifies-exhaustive: true

  cyclop:
    max-complexity: 15

  gocognit:
    min-complexity: 20

  revive:
    rules:
      - name: exported
      - name: var-naming
      - name: receiver-naming

  govet:
    enable-all: true
    disable:
      - fieldalignment  # too noisy for proto-embedding structs

issues:
  exclude-rules:
    # Test files are exempt from errcheck, gosec, and cyclop
    - path: "_test\\.go"
      linters:
        - errcheck
        - gosec
        - cyclop

  exclude-dirs:
    # Exclude generated code and vendor
    - gen
    - vendor
