# docker-compose.yml — local development stack for the Citius (caas) server.
#
# Runs the server from source (`go run`) with NO TLS and NO authentication,
# published on the host's loopback only (127.0.0.1:50051), then seeds the
# sample crypto policies in dev/policies.
#
#   docker compose up -d                        # start + seed
#   docker compose logs -f citius-server
#   docker compose run --rm seed-policies       # re-seed (state is in memory)
#   docker compose down                         # stop (add -v to drop Go caches)
#
# go.mod replaces citius-api-go and citius-core with ../api and ../citius-core.
# Those paths are resolved relative to go.mod, so the sibling repositories are
# mounted next to the server checkout, mirroring the host layout under
# /workspace. This is also why the repository Dockerfile (build context `.`)
# is not used here: it cannot see the sibling repositories.
#
# Other containers reach the server in plaintext at citius-server:50051 on the
# `citius-dev` network; another compose project joins it with
#   networks: { citius-dev: { external: true } }

name: citius-dev

# Toolchain-only image (see dev/Dockerfile); sources are bind-mounted.
x-dev-image: &dev-image
  build:
    context: dev
    dockerfile: Dockerfile
  image: citius-server-dev:local

services:
  citius-server:
    <<: *dev-image
    working_dir: /workspace/citius-server
    command:
      - go
      - run
      - ./internal/cmd/server/main
      # 0.0.0.0, not 127.0.0.1: the port must be reachable from outside the
      # container; the host-side binding below keeps it off the LAN.
      - -addr=0.0.0.0:50051
      - -catalog=proto/standard_algorithms.json
      # Reflection lets grpcurl work without protos (seeding, debugging);
      # health backs the healthcheck. Both are dev-only conveniences.
      - -grpc-reflection
      - -grpc-health
    environment:
      AUTH_ENABLED: "false"
      CGO_ENABLED: "1"
      # OPENSSL_FIPS_CONFIG is left unset: no openssl-fips provider instance.
    volumes:
      - .:/workspace/citius-server
      # Module replacements from go.mod (../api, ../citius-core).
      - ../api:/workspace/api:ro
      - ../citius-core:/workspace/citius-core:ro
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    ports:
      - "127.0.0.1:50051:50051"
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "localhost:50051", "grpc.health.v1.Health/Check"]
      interval: 5s
      timeout: 3s
      retries: 10
      # The first start compiles everything (cgo included); the build cache
      # volume makes later starts fast.
      start_period: 600s
    networks:
      - citius

  # One-shot job: creates every dev/policies/<name>.json as policy <name>.
  seed-policies:
    <<: *dev-image
    working_dir: /workspace/citius-server
    command: ["bash", "scripts/seed_policies.sh", "citius-server:50051", "dev/policies"]
    volumes:
      - ./scripts:/workspace/citius-server/scripts:ro
      - ./dev/policies:/workspace/citius-server/dev/policies:ro
    depends_on:
      citius-server:
        condition: service_healthy
        # Re-run the seed when compose restarts the server (state is in memory).
        restart: true
    restart: "no"
    networks:
      - citius

networks:
  citius:
    # Fixed name (no project prefix) so other compose projects can join it.
    name: citius-dev

volumes:
  gomodcache:
  gobuildcache:
