name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    name: ci          
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Generate proto code
        run: make proto

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: binary
          skip-cache: false

      - name: Run CI gate
        run: make ci
